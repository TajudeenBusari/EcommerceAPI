name: Ecommerce build and deploy microservices to Azure Container Apps

env:
  AZURE_RESOURCE_GROUP: ecommerce-java-resource-group
  AZURE_CONTAINERAPPS_ENVIRONMENT: ecommerce-container-apps-env
  AZURE_LOCATION: swedencentral
  FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_CONFIG_BASE64 }}
  JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
  JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}

on:
  push:
    branches:
      - master

permissions:
  contents: 'read'
  packages: 'write'
  id-token: 'write'

jobs:
  #======================================================================#
  # Build all modules and cache JAR files
  #======================================================================#
  build:
    name: Build All Modules
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Decode and save Firebase config
        run: |
          echo "$FIREBASE_CONFIG_BASE64" | base64 -d > firebase-service-config.json

      - name: Create JWT Key files
        run: |
          mkdir -p user-service/src/main/resources/certs
          printf "%s" "$JWT_PRIVATE_KEY" > user-service/src/main/resources/certs/private.pem
          printf "%s" "$JWT_PUBLIC_KEY" > user-service/src/main/resources/certs/public.pem

      - name: Build all Maven modules (skipping tests)
        run: |
          mvn --batch-mode clean install -DskipTests

      - name: Upload Maven target directory
        uses: actions/upload-artifact@v4
        with:
          name: maven-targets
          path: |
            api-gateway/target
            config-server/target
            eureka-server/target
            inventory-service/target
            notification-service/target
            order-service/target
            product-service/target
            user-service/target
          retention-days: 1

  #=====================================================#
  # Build and push Docker images
  #=====================================================#
  docker:
    name: Build and Push ${{ matrix.service }} Docker Image
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - config-server
          - eureka-server
          - inventory-service
          - notification-service
          - order-service
          - product-service
          - user-service
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Maven target directories from previous job
        uses: actions/download-artifact@v4
        with:
          name: maven-targets
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
          # Fallback: if PAT not available, use GITHUB_TOKEN
          # password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the repo name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Verify GHCR authentication
        run: |
          echo "Verifying GHCR authentication..."
          echo "Repository: ${{ env.REPO }}"
          
          #Test authentication by trying to list tags
          curl -f -H "Authorization: Bearer ${{ secrets.GHCR_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/user/packages 2>&1 || echo "Authentication test completed"

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ============================================================
  # Create Azure Container Apps environment
  # ============================================================
  create-container-app-environment:
    name: Create Azure Container App Environment
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login using Github OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-oidc: true

      - name: Install Azure Container Apps Extension
        run: |
          az extension add --name containerapp --upgrade

      - name: Create resource group if it does not exist
        run: |
          az group create --name ${{ env.AZURE_RESOURCE_GROUP }} --location ${{ env.AZURE_LOCATION }}

      - name: Create Azure Container Apps Environment
        run: |
          if az containerapp env show --name ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            > /dev/null 2>&1; then
              echo "Azure Container Apps Environment already exists."
          else
              az containerapp env create \
                --name ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }} \
                --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                --location ${{ env.AZURE_LOCATION }}
          fi

  #===========================================================#
  # Deploy Eureka Server FIRST
  #===========================================================#
  deploy-eureka:
    name: Deploy Eureka Server
    needs: create-container-app-environment
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-oidc: true

      - name: Install Azure Container Apps Extension
        run: |
          az extension add --name containerapp --upgrade

      - name: Lowercase the repo name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Create or Update Eureka Server
        run: |
          IMAGE="ghcr.io/${REPO}/eureka-server:${{ github.sha }}"
          
          EUREKA_ENV_VARS="SPRING_PROFILES_ACTIVE=default SERVER_PORT=8761 EUREKA_CLIENT_REGISTER_WITH_EUREKA=false EUREKA_CLIENT_FETCH_REGISTRY=false"
          
          
          
          if az containerapp show \
            --name ecommerce-eureka-server \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            > /dev/null 2>&1; then
          
            echo "Container App ecommerce-eureka-server already exists. Updating..."
          
            az containerapp update \
              --name ecommerce-eureka-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image "$IMAGE" \
              --set-env-vars $EUREKA_ENV_VARS
            
          
            echo "Eureka Container App updated."
          
          else
          
            echo "Container App does not exist. Creating ..."
          
            az containerapp create \
              --name ecommerce-eureka-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --environment ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }} \
              --image "$IMAGE" \
              --ingress internal \
              --target-port 8761 \
              --min-replicas 1 \
              --max-replicas 1 \
              --env-vars $EUREKA_ENV_VARS \
              --registry-server ghcr.io \
              --registry-username "${{ github.actor }}" \
              --registry-password "${{ secrets.GHCR_PAT }}"
          
            echo "Eureka Container App created."
          
          fi

      - name: Wait for Eureka Server readiness
        shell: bash
        run: |
          echo "Waiting for Eureka Server to be ready..."
          for i in {1..30}; do
            STATUS=$(az containerapp show \
              --name ecommerce-eureka-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "properties.runningStatus" \
              -o tsv 2>/dev/null || true)
          
            echo "Attempt $i/30 - Eureka Server status: $STATUS"
          
            if [ "$STATUS" = "Running" ]; then
              echo "Eureka Container App is running."
              break
            fi
          
            if [ "$i" -eq 30 ]; then
              echo "Eureka Server did not become ready."
              exit 1
            fi
          
            sleep 10
          done

      # ==================== FIXED: Get Eureka FQDN with Retry ====================
      - name: Get Eureka Server FQDN with retry
        run: |
          echo "Attempting to get Eureka FQDN..."
          
          EUREKA_FQDN=""
          
          for i in {1..5}; do
            echo "Attempt $i/5..."
          
            EUREKA_FQDN=$(az containerapp show \
              --name ecommerce-eureka-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.fqdn" \
              -o tsv \
              --only-show-errors 2>/dev/null) && break
            echo "Attempt $i failed. Retrying in 5 seconds..."
            sleep 5
          done
          
          if [ -z "$EUREKA_FQDN" ]; then
            echo " Failed to get Eureka FQDN after 5 attempts"
            # Try one more time with full output for debugging
            EUREKA_FQDN=$(az containerapp show \
              --name ecommerce-eureka-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.fqdn" \
              -o tsv)
          fi
          
          if [ -z "$EUREKA_FQDN" ]; then
            echo "ERROR: Eureka FQDN is empty."
            exit 1 
          fi
          
          
          echo "EUREKA_FQDN=$EUREKA_FQDN" >> $GITHUB_ENV
          echo "Eureka FQDN: $EUREKA_FQDN"

  #===========================================================#
  # Deploy Config Server
  #===========================================================#
  deploy-config-server:
    name: Deploy Config Server
    needs: deploy-eureka
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-oidc: true

      - name: Install Azure Container Apps Extension
        run: |
          az extension add --name containerapp --upgrade

      - name: Lowercase the repo name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      # ==================== FIXED: Get Eureka FQDN with Retry ====================
      - name: Get Eureka FQDN from previous deployment
        run: |
          echo "Getting Eureka FQDN for Config Server..."
          
          for i in {1..5}; do
            echo "Attempt $i/5..."
            EUREKA_FQDN=$(az containerapp show \
              --name ecommerce-eureka-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.fqdn" \
              -o tsv \
              --only-show-errors 2>/dev/null) && break
            echo "Attempt $i failed. Retrying in 5 seconds..."
            sleep 5
          done
          
          if [ -z "$EUREKA_FQDN" ]; then
            echo "ERROR: Eureka FQDN is empty."
            exit 1
          fi
          
          echo "EUREKA_FQDN=$EUREKA_FQDN" >> $GITHUB_ENV
          echo " Eureka FQDN: $EUREKA_FQDN"

      - name: Create or Update Config Server
        run: |
          IMAGE="ghcr.io/${REPO}/config-server:${{ github.sha }}"
          
          EUREKA_URL="https://${EUREKA_FQDN}/eureka/"
    
          CONFIG_ENV_VARS="SPRING_PROFILES_ACTIVE=default SERVER_PORT=8888 EUREKA_SERVER_URL=$EUREKA_URL EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=$EUREKA_URL EUREKA_CLIENT_REGISTER_WITH_EUREKA=true EUREKA_CLIENT_FETCH_REGISTRY=true"
          
          
          echo "Config Server Environment Variables:"
          echo "  EUREKA_SERVER_URL: $EUREKA_URL"
          echo "  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: $EUREKA_URL"
          
          if az containerapp show \
            --name ecommerce-config-server \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            > /dev/null 2>&1; then
          
            echo "Container App ecommerce-config-server already exists. Updating..."
          
            az containerapp update \
              --name ecommerce-config-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image "$IMAGE" \
              --set-env-vars $CONFIG_ENV_VARS
          
          else
          
            echo "Container App does not exist. Creating ..."
          
            az containerapp create \
              --name ecommerce-config-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --environment ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }} \
              --image "$IMAGE" \
              --ingress internal \
              --target-port 8888 \
              --min-replicas 1 \
              --max-replicas 1 \
              --env-vars $CONFIG_ENV_VARS \
              --registry-server ghcr.io \
              --registry-username "${{ github.actor }}" \
              --registry-password "${{ secrets.GHCR_PAT }}"

              
          fi

      - name: Wait for Config Server readiness
        shell: bash
        run: |
          echo "Waiting for Config Server to be ready..."
          for i in {1..30}; do
            STATUS=$(az containerapp show \
              --name ecommerce-config-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "properties.runningStatus" \
              -o tsv 2>/dev/null || true)
          
            echo "Attempt $i/30 - Config Server status: $STATUS"
          
            if [ "$STATUS" = "Running" ]; then
              echo "Config Container App is running."
              break
            fi
          
            if [ "$i" -eq 30 ]; then
              echo "Config Server did not become ready."
              exit 1
            fi
          
            sleep 10
          done

      # ====================Verify Config Server via logs ====================
      - name: Verify Config Server via logs
        run: |
          echo "Checking Config Server logs..."
          
          # Give it a moment to start up
          sleep 15
          
          LOGS=$(az containerapp logs show \
            --name ecommerce-config-server \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --tail 100 2>/dev/null || echo "No logs available")
          
          echo "Recent Config Server logs:"
          echo "$LOGS"
          
          # Check for successful startup
          if echo "$LOGS" | grep -i "Started ConfigServerApplication" > /dev/null; then
            echo "Config Server started successfully!"
          else
            echo "Config Server may not have started properly"
          fi
          
          # Check if Config Server registered with Eureka
          if echo "$LOGS" | grep -i "registered with eureka" > /dev/null; then
            echo "Config Server registered with Eureka!"
          elif echo "$LOGS" | grep -i "eureka" > /dev/null; then
            echo "Config Server connected to Eureka"
          else
            echo "Check if Config Server is registered with Eureka"
          fi

      - name: Get Config Server FQDN
        run: |
          echo "Getting Config Server FQDN..."
          
          CONFIG_FQDN=""
          
          for i in {1..5}; do
            echo "Attempt $i/5..."
            CONFIG_FQDN=$(az containerapp show \
              --name ecommerce-config-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.fqdn" \
              -o tsv \
              --only-show-errors 2>/dev/null) && break
            echo "Attempt $i failed. Retrying in 5 seconds..."
            sleep 5
          done
          
          if [ -z "$CONFIG_FQDN" ]; then
            echo "ERROR: Could not retrieve Config Server FQDN."
            exit 1
          fi
          
          echo "CONFIG_FQDN=$CONFIG_FQDN" >> $GITHUB_ENV
          echo "Config Server Internal FQDN: $CONFIG_FQDN"
          echo ""
          echo "NOTE: Config Server is deployed with internal ingress."
          echo "   It is only accessible from within the Container Apps environment."
          echo "   Services inside the environment can reach it using the internal FQDN:"
          echo "   https://${CONFIG_FQDN}"

  #===========================================================#
  # Deploy all other microservices
  #===========================================================#
  deploy:
    name: Deploy ${{ matrix.service }} to Azure Container Apps
    needs: deploy-config-server
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            container_app: ecommerce-api-gateway
            port: 8080
            ingress: external
            uses_data_services: false

          - service: inventory-service
            container_app: ecommerce-inventory-service
            port: 8084
            ingress: external #temporarily set to external for testing, change to internal in production
            database: ECommerce-Inventory-Service
            uses_data_services: true

          - service: notification-service
            container_app: ecommerce-notification-service
            port: 8085
            ingress: internal
            database: ECommerce-Notification-Service
            uses_data_services: true

          - service: order-service
            container_app: ecommerce-order-service
            port: 8082
            ingress: internal
            database: ECommerce-Order-Service
            uses_data_services: true

          - service: product-service
            container_app: ecommerce-product-service
            port: 8083
            ingress: internal
            database: ECommerce-Product-Service
            uses_data_services: true

          - service: user-service
            container_app: ecommerce-user-service
            port: 8086
            ingress: internal
            database: ECommerce-User-Service
            uses_data_services: true

    steps:
      - name: Azure Login using Github OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-oidc: true

      - name: Install Azure Container Apps Extension
        run: |
          az extension add --name containerapp --upgrade

      - name: Lowercase the repo name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      # ==================== FIXED: Get both FQDNs with Retry ====================
      - name: Get Service URLs with retry
        run: |
          echo "Getting Eureka FQDN..."
          for i in {1..5}; do
            EUREKA_FQDN=$(az containerapp show \
              --name ecommerce-eureka-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.fqdn" \
              -o tsv \
              --only-show-errors 2>/dev/null) && break
            echo "Attempt $i failed. Retrying..."
            sleep 5
          done
          
          echo "Getting Config Server FQDN..."
          
          CONFIG_FQDN=""
          
          for i in {1..5}; do
            CONFIG_FQDN=$(az containerapp show \
              --name ecommerce-config-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.fqdn" \
              -o tsv \
              --only-show-errors 2>/dev/null) && break
            echo "Attempt $i failed. Retrying..."
            sleep 5
          done
          
          if [ -z "$EUREKA_FQDN" ]; then
            echo "ERROR: Eureka FQDN is empty."
            exit 1
          fi
          
          if [ -z "$CONFIG_FQDN" ]; then
            echo "ERROR: Config Server FQDN is empty."
            exit 1
          fi
          
          echo "EUREKA_FQDN=$EUREKA_FQDN" >> $GITHUB_ENV
          echo "CONFIG_FQDN=$CONFIG_FQDN" >> $GITHUB_ENV
          echo "Eureka FQDN: $EUREKA_FQDN"
          echo "Config FQDN: $CONFIG_FQDN"

      - name: Create or Update ${{ matrix.container_app }}
        run: |
          IMAGE="ghcr.io/${{ env.REPO }}/${{ matrix.service }}:${{ github.sha }}"
          
          EUREKA_URL="https://${EUREKA_FQDN}/eureka/"
          CONFIG_URL="https://${CONFIG_FQDN}"
          
          BASE_ENV_VARS="\
          SPRING_APPLICATION_NAME=${{ matrix.service }} \
          SPRING_PROFILES_ACTIVE=default \
          SERVER_PORT=${{ matrix.port }} \
          EUREKA_CLIENT_REGISTER_WITH_EUREKA=true \
          EUREKA_CLIENT_FETCH_REGISTRY=true \
          EUREKA_SERVER_URL=$EUREKA_URL \
          EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=$EUREKA_URL \
          SPRING_CONFIG_IMPORT=optional:configserver:$CONFIG_URL"
          if [ "${{ matrix.uses_data_services }}" = "true" ]; then
            SERVICE_ENV_VARS="$BASE_ENV_VARS \
            DB_HOST=ecommerce-java.postgres.database.azure.com \
            DB_NAME=${{ matrix.database }} \
            DB_USER=${{ secrets.DB_USER }} \
            DB_PASSWORD=secretref:db-password \
            REDIS_HOST=ecommerce-java-redis.swedencentral.redis.azure.net \
            REDIS_PORT=10000 \
            REDIS_PASSWORD=secretref:redis-password \
            REDIS_SSL_ENABLED=true"
          else
            SERVICE_ENV_VARS="$BASE_ENV_VARS"
          fi
          
          echo "Deploying:"
          echo "  Service: ${{ matrix.service }}"
          echo "  Container App: ${{ matrix.container_app }}"
          echo "  Image: $IMAGE"
          echo "  Port: ${{ matrix.port }}"
          echo "  Ingress: ${{ matrix.ingress }}"
          echo "  Config URL: $CONFIG_URL"
          echo "  Eureka URL: $EUREKA_URL"
          echo "  SPRING_CONFIG_IMPORT: optional:configserver:$CONFIG_URL"
          if [ "${{ matrix.uses_data_services }}" = "true" ]; then
            echo "  Database: ${{ matrix.database }}"
            echo "  DB_HOST: ecommerce-java.postgres.database.azure.com"
            echo "  DB_USER configure: yes"
            echo "  REDIS_HOST: ecommerce-java-redis.swedencentral.redis.azure.net"
            echo "  REDIS_PORT: 10000"
            echo "  REDIS_SSL_ENABLED: true"
          else
            echo "  Database/Redis configuration: not required for this service"
          fi
          
          if az containerapp show \
            --name ${{ matrix.container_app }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            > /dev/null 2>&1; then
          
            echo "Container App ${{ matrix.container_app }} already exists. Updating..."
          
            #store sensitive values as Azure Container App Secrets
            if [ "${{ matrix.uses_data_services }}" = "true" ]; then
              az containerapp secret set \
                --name ${{ matrix.container_app }} \
                --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                --secrets \
                  db-password="${{ secrets.DB_PASSWORD }}" \
                  redis-password="${{ secrets.REDIS_PASSWORD }}"
            fi
          
            #update the image and environment variables for the existing container app
            az containerapp update \
              --name ${{ matrix.container_app }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image "$IMAGE" \
              --set-env-vars $SERVICE_ENV_VARS
          
          else
          
            echo "Container App does not exist. Creating ..."
            if [ "${{ matrix.uses_data_services }}" = "true" ]; then
              az containerapp create \
                --name ${{ matrix.container_app }} \
                --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                --environment ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }} \
                --image "$IMAGE" \
                --ingress ${{ matrix.ingress }} \
                --target-port ${{ matrix.port }} \
                --min-replicas 1 \
                --max-replicas 1 \
                --secrets \
                  db-password="${{ secrets.DB_PASSWORD }}" \
                  redis-password="${{ secrets.REDIS_PASSWORD }}" \
                --env-vars $SERVICE_ENV_VARS \
                --registry-server ghcr.io \
                --registry-username "${{ github.actor }}" \
                --registry-password "${{ secrets.GHCR_PAT }}"
          
            else
              az containerapp create \
                --name ${{ matrix.container_app }} \
                --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                --environment ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }} \
                --image "$IMAGE" \
                --ingress ${{ matrix.ingress }} \
                --target-port ${{ matrix.port }} \
                --min-replicas 1 \
                --max-replicas 1 \
                --env-vars $SERVICE_ENV_VARS \
                --registry-server ghcr.io \
                --registry-username "${{ github.actor }}" \
                --registry-password "${{ secrets.GHCR_PAT }}"
            fi
          fi

      - name: Wait for service to be ready
        shell: bash
        run: |
          echo "Waiting for ${{ matrix.service }} to be ready..."
          for i in {1..20}; do
            STATUS=$(az containerapp show \
              --name ${{ matrix.container_app }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "properties.runningStatus" \
              -o tsv 2>/dev/null || echo "Unknown")
          
            echo "Attempt $i/20 - Status: $STATUS"
          
            if [ "$STATUS" = "Running" ]; then
              echo "${{ matrix.container_app }} is running"
              break
            fi
          
            if [ "$i" -eq 20 ]; then
              echo "Service may not be ready yet"
            fi
          
            sleep 10
          done

      - name: Check service health and configuration
        if: matrix.ingress == 'external'
        shell: bash
        run: |
          FQDN=$(az containerapp show \
            --name "${{ matrix.container_app }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)

          echo "=================================================="
          echo "Checking health at:"
          echo "https://${FQDN}/actuator/health"
          echo "=================================================="

          HEALTH_OK=false
          RESPONSE=""

          for i in {1..15}; do
            RESPONSE=$(curl -sS \
              --connect-timeout 10 \
              --max-time 20 \
              "https://${FQDN}/actuator/health" \
              2>/dev/null || true)

            if [ -n "$RESPONSE" ]; then
              echo "Health endpoint responded on attempt $i."

              echo "$RESPONSE" | jq '.' 2>/dev/null || echo "$RESPONSE"

              STATUS=$(echo "$RESPONSE" | jq -r '.status // empty' 2>/dev/null || true)

              echo "Actuator health status: ${STATUS:-UNKNOWN}"

              if [ "$STATUS" = "UP" ]; then
                HEALTH_OK=true
                echo "Health check passed on attempt $i."
                break
              fi

              echo "Attempt $i/15 - Health endpoint responded but service status is '${STATUS:-UNKNOWN}'."
            else
              echo "Attempt $i/15 - Health endpoint not responding yet."
            fi

            sleep 10
          done

          echo "=================================================="
          echo "Health check analysis"
          echo "=================================================="

          if [ "$HEALTH_OK" = false ]; then
            echo "WARNING: Service health did not reach UP after 15 attempts."

            if [ -n "$RESPONSE" ]; then
              echo "The health endpoint responded, but the service is not healthy."
              echo "Final health response:"
              echo "$RESPONSE" | jq '.' 2>/dev/null || echo "$RESPONSE"
            else
              echo "The health endpoint did not respond."
              echo "The Container App itself may still be starting or may have failed."
            fi

            echo "Continuing deployment."
          else
            echo "Health endpoint reports UP."

            # --------------------------------------------------
            # Check Config Server connection
            # --------------------------------------------------

            if echo "$RESPONSE" | grep -q "clientConfigServer.*UNKNOWN"; then
              echo "WARNING: Config Server connection issue detected!"
              echo "Config Server URL:"
              echo "https://${CONFIG_FQDN}"
            else
              echo "Config Server connection does not report UNKNOWN."
            fi

            # --------------------------------------------------
            # Check Eureka connection
            # --------------------------------------------------

            if echo "$RESPONSE" | grep -q "Eureka discovery client has not yet successfully connected"; then
              echo "WARNING: Eureka connection issue detected!"
              echo "Eureka URL:"
              echo "https://${EUREKA_FQDN}/eureka/"
            else
              echo "Eureka connection does not report a connection failure."
            fi

            # --------------------------------------------------
            # Overall health status
            # --------------------------------------------------

            if echo "$RESPONSE" | grep -q '"status"[[:space:]]*:[[:space:]]*"UP"' \
              && ! echo "$RESPONSE" | grep -q "UNKNOWN"; then
              echo "All reported health indicators are UP."
            else
              echo "WARNING: One or more health indicators may not be UP."
            fi
          fi

      - name: Display service URL if external
        if: matrix.ingress == 'external'
        shell: bash
        run: |
          FQDN=$(az containerapp show \
            --name "${{ matrix.container_app }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)

          echo "=================================================="
          echo "${{ matrix.service }} is available at:"
          echo "https://${FQDN}"
          echo "=================================================="

  #===========================================================#
  # Final job to display all service URLs
  #===========================================================#
  display-urls:
    name: Display All Service URLs
    needs: deploy
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Azure Login using Github OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-oidc: true

      - name: Install Azure Container Apps Extension
        run: |
          az extension add --name containerapp --upgrade

      - name: Display all service URLs and debug info
        run: |
          echo "=================================================="
          echo "ALL SERVICES DEPLOYED SUCCESSFULLY!"
          echo "=================================================="
          echo ""
          
          # ============================================================ 
          # Get Eureka FQDN 
          # ============================================================
          
          EUREKA_FQDN=""
          
          for i in {1..5}; do
            EUREKA_FQDN=$(az containerapp show \
              --name ecommerce-eureka-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.fqdn" \
              -o tsv 2>/dev/null) && break
            sleep 5
          done
          
          # ============================================================ 
          # Get Config Server FQDN 
          # ============================================================
          
          CONFIG_FQDN=""
          
          for i in {1..5}; do
            CONFIG_FQDN=$(az containerapp show \
              --name ecommerce-config-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.fqdn" \
              -o tsv 2>/dev/null) && break
            sleep 5
          done
          
          GATEWAY_FQDN=$(az containerapp show \
            --name ecommerce-api-gateway \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv 2>/dev/null || echo "Not deployed")
          
          echo "EUREKA SERVER:"
          echo "   URL: https://${EUREKA_FQDN}"
          echo "   Health: https://${EUREKA_FQDN}/actuator/health"
          echo "   Dashboard: https://${EUREKA_FQDN}"
          echo ""
          
          echo "CONFIG SERVER:"
          echo "   URL: https://${CONFIG_FQDN}"
          echo "   Health: https://${CONFIG_FQDN}/actuator/health"
          echo ""
          
          echo "PUBLIC ENDPOINT:" 
          echo "   API Gateway: https://${GATEWAY_FQDN}"
          echo "   Health: https://${GATEWAY_FQDN}/actuator/health"
          echo ""
          
          echo "Environment Variables to use in your services:"
          echo "   CONFIG_SERVER_URL=https://${CONFIG_FQDN}"
          echo "   EUREKA_SERVER_URL=https://${EUREKA_FQDN}/eureka"
          echo ""
          
          echo "Check if services are registered with Eureka:"
          echo "   curl https://${EUREKA_FQDN}/eureka/apps"
          echo ""
          
          echo "=================================================="