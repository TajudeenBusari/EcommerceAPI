name: Ecommerce build and deploy microservices to Azure Container Apps

env:
  AZURE_RESOURCE_GROUP: ecommerce-java-resource-group
  AZURE_CONTAINERAPPS_ENVIRONMENT: ecommerce-container-apps-env
  AZURE_LOCATION: swedencentral
  FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_CONFIG_BASE64 }}
  JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
  JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}

on:
  push:
    branches:
      - master

permissions:
  contents: 'read'
  packages: 'write'
  id-token: 'write'

jobs:
  #======================================================================#
  # Build all modules and cache JAR files
  #======================================================================#
  build:
    name: Build All Modules
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Decode and save Firebase config
        run: |
          echo "$FIREBASE_CONFIG_BASE64" | base64 -d > firebase-service-config.json

      - name: Create JWT Key files
        run: |
          mkdir -p user-service/src/main/resources/certs
          printf "%s" "$JWT_PRIVATE_KEY" > user-service/src/main/resources/certs/private.pem
          printf "%s" "$JWT_PUBLIC_KEY" > user-service/src/main/resources/certs/public.pem

      - name: Build all Maven modules (skipping tests)
        run: |
          mvn --batch-mode clean install -DskipTests

      - name: Upload Maven target directory
        uses: actions/upload-artifact@v4
        with:
          name: maven-targets
          path: |
            api-gateway/target
            config-server/target
            eureka-server/target
            inventory-service/target
            notification-service/target
            order-service/target
            product-service/target
            user-service/target
          retention-days: 1

  #=====================================================#
  # Build and push Docker images
  #=====================================================#
  docker:
    name: Build and Push ${{ matrix.service }} Docker Image
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - config-server
          - eureka-server
          - inventory-service
          - notification-service
          - order-service
          - product-service
          - user-service
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Maven target directories from previous job
        uses: actions/download-artifact@v4
        with:
          name: maven-targets
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the repo name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Create Azure Container Apps environment
  # ============================================================
  create-container-app-environment:
    name: Create Azure Container App Environment
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login using Github OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-oidc: true

      - name: Install Azure Container Apps Extension
        run: |
          az extension add --name containerapp --upgrade

      - name: Create resource group if it does not exist
        run: |
          az group create --name ${{ env.AZURE_RESOURCE_GROUP }} --location ${{ env.AZURE_LOCATION }}

      - name: Create Azure Container Apps Environment
        run: |
          if az containerapp env show --name ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            > /dev/null 2>&1; then
              echo "Azure Container Apps Environment already exists."
          else
              az containerapp env create \
                --name ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }} \
                --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                --location ${{ env.AZURE_LOCATION }}
          fi

  #===========================================================#
  # Deploy Eureka Server FIRST (standalone, no dependencies)
  #===========================================================#
  deploy-eureka:
    name: Deploy Eureka Server
    needs: create-container-app-environment
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-oidc: true

      - name: Install Azure Container Apps Extension
        run: |
          az extension add --name containerapp --upgrade

      - name: Lowercase the repo name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Create or Update Eureka Server
        run: |
          IMAGE="ghcr.io/${REPO}/eureka-server:${{ github.sha }}"
          
          # Eureka server runs standalone
          EUREKA_ENV_VARS="SPRING_PROFILES_ACTIVE=azure SERVER_PORT=8761"
          
          if az containerapp show \
            --name ecommerce-eureka-server \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            > /dev/null 2>&1; then
          
            echo "Container App ecommerce-eureka-server already exists. Updating..."
          
            az containerapp update \
              --name ecommerce-eureka-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image "$IMAGE" \
              --set-env-vars $EUREKA_ENV_VARS
          
            echo "Eureka Container App updated."
          
          else
          
            echo "Container App does not exist. Creating ..."
          
            az containerapp create \
              --name ecommerce-eureka-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --environment ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }} \
              --image "$IMAGE" \
              --ingress internal \
              --target-port 8761 \
              --min-replicas 1 \
              --max-replicas 1 \
              --env-vars $EUREKA_ENV_VARS \
              --health-probe \
                --type liveness \
                --path /actuator/health \
                --port 8761 \
                --initial-delay 60 \
                --period 30
          
            echo "Eureka Container App created."
          
          fi

      - name: Wait for Eureka Server readiness
        shell: bash
        run: |
          echo "Waiting for Eureka Server to be ready..."
          for i in {1..30}; do
            STATUS=$(az containerapp show \
              --name ecommerce-eureka-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "properties.runningStatus" \
              -o tsv 2>/dev/null || true)
          
            echo "Attempt $i/30 - Eureka Server status: $STATUS"
          
            if [ "$STATUS" = "Running" ]; then
              echo "Eureka Container App is running."
              break
            fi
          
            if [ "$i" -eq 30 ]; then
              echo "Eureka Server did not become ready."
              exit 1
            fi
          
            sleep 10
          done

      - name: Get Eureka Server FQDN
        run: |
          EUREKA_FQDN=$(az containerapp show \
            --name ecommerce-eureka-server \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          
          echo "EUREKA_FQDN=$EUREKA_FQDN" >> $GITHUB_ENV
          echo "Eureka FQDN: $EUREKA_FQDN"
          

  #===========================================================#
  # Deploy Config Server (registers with Eureka)
  # Config Server uses bootstrap.yml with config.import
  #===========================================================#
  deploy-config-server:
    name: Deploy Config Server
    needs: deploy-eureka
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-oidc: true

      - name: Install Azure Container Apps Extension
        run: |
          az extension add --name containerapp --upgrade

      - name: Lowercase the repo name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      # ==================== UPDATE 2: Get Eureka FQDN again ====================
      - name: Get Eureka FQDN From previous job
        run: |
          EUREKA_FQDN=$(az containerapp show \
            --name ecommerce-eureka-server \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)

          echo "EUREKA_FQDN=$EUREKA_FQDN" >> $GITHUB_ENV
          echo "Eureka FQDN: $EUREKA_FQDN"

      # ==================== UPDATE 3: Config Server uses FQDN ====================
      - name: Create or Update Config Server
        run: |
          IMAGE="ghcr.io/${REPO}/config-server:${{ github.sha }}"
          
          EUREKA_URL="http://${EUREKA_FQDN}:8761/eureka/"
          
          EUREKA_ENV_VARS="SPRING_PROFILES_ACTIVE=azure SERVER_PORT=8761"
          
          CONFIG_ENV_VARS="SPRING_PROFILES_ACTIVE=azure SERVER_PORT=8888 EUREKA_SERVER_URL=$EUREKA_URL"
          
          echo "Config Server Environment Variables:"
          echo "  EUREKA_SERVER_URL: $EUREKA_URL"
          
          if az containerapp show \
            --name ecommerce-config-server \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            > /dev/null 2>&1; then
          
            echo "Container App ecommerce-config-server already exists. Updating..."
          
            az containerapp update \
              --name ecommerce-config-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image "$IMAGE" \
              --set-env-vars $CONFIG_ENV_VARS
               
            echo "Config Container App updated."
          
          else
          
            echo "Container App does not exist. Creating ..."
          
            az containerapp create \
              --name ecommerce-config-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --environment ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }} \
              --image "$IMAGE" \
              --ingress internal \
              --target-port 8888 \
              --min-replicas 1 \
              --max-replicas 1 \
              --env-vars $CONFIG_ENV_VARS \
              --health-probe \
                --type liveness \
                --path /actuator/health \
                --port 8888 \
                --initial-delay 60 \
                --period 30
            
            echo "Config Container App created."
               
          fi

      - name: Wait for Config Server readiness
        shell: bash
        run: |
          echo "Waiting for Config Server to be ready..."
          for i in {1..30}; do
            STATUS=$(az containerapp show \
              --name ecommerce-config-server \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "properties.runningStatus" \
              -o tsv 2>/dev/null || true)
          
            echo "Attempt $i/30 - Config Server status: $STATUS"
          
            if [ "$STATUS" = "Running" ]; then
              echo "Config Container App is running."
              break
            fi
          
            if [ "$i" -eq 30 ]; then
              echo "Config Server did not become ready."
              exit 1
            fi
          
            sleep 10
          done

      # ==================== Get config server FQDN ====================
      - name: Get Config Server FQDN
        run: |
          CONFIG_FQDN=$(az containerapp show \
            --name ecommerce-config-server \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
            
          echo "CONFIG_FQDN=$CONFIG_FQDN" >> $GITHUB_ENV
          echo "Config Server FQDN: $CONFIG_FQDN"
          
          # Test Config Server health from outside
          echo "Testing Config Server health..."
          curl -f "http://${CONFIG_FQDN}:8888/actuator/health" || echo "Config Server health check failed"

  # ============================================================#
  # Deploy all other microservices
  # Each service will:
  # 1. Use bootstrap.yml with config.import to get config
  # 2. Register with Eureka
  # ============================================================#
  deploy:
    name: Deploy ${{ matrix.service }} to Azure Container Apps
    needs: deploy-config-server
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            container_app: ecommerce-api-gateway
            port: 8080
            ingress: external

          - service: inventory-service
            container_app: ecommerce-inventory-service
            port: 8084
            ingress: internal

          - service: notification-service
            container_app: ecommerce-notification-service
            port: 8085
            ingress: internal

          - service: order-service
            container_app: ecommerce-order-service
            port: 8082
            ingress: internal

          - service: product-service
            container_app: ecommerce-product-service
            port: 8083
            ingress: internal

          - service: user-service
            container_app: ecommerce-user-service
            port: 8081
            ingress: internal

    steps:
      - name: Azure Login using Github OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-oidc: true

      - name: Install Azure Container Apps Extension
        run: |
          az extension add --name containerapp --upgrade

      - name: Lowercase the repo name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
          
      

      - name: Get Service URLs
        run: |
          # Get Eureka FQDN
          EUREKA_FQDN=$(az containerapp show \
            --name ecommerce-eureka-server \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
    
          echo "EUREKA_FQDN=$EUREKA_FQDN" >> $GITHUB_ENV
          echo "Eureka FQDN: $EUREKA_FQDN"
    
          # Get Config Server FQDN
          CONFIG_FQDN=$(az containerapp show \
            --name ecommerce-config-server \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
    
          echo "CONFIG_FQDN=$CONFIG_FQDN" >> $GITHUB_ENV
          echo "Config FQDN: $CONFIG_FQDN"

      - name: Create or Update ${{ matrix.container_app }}
        run: |
          IMAGE="ghcr.io/${{ env.REPO }}/${{ matrix.service }}:${{ github.sha }}"
          
          EUREKA_URL="http://${EUREKA_FQDN}:8761/eureka/"
          CONFIG_URL="http://${CONFIG_FQDN}:8888"
          SERVICE_ENV_VARS="SPRING_PROFILES_ACTIVE=azure SERVER_PORT=${{ matrix.port }} CONFIG_SERVER_URL=$CONFIG_URL EUREKA_SERVER_URL=$EUREKA_URL"

          echo "Deploying:"
          echo "  Service: ${{ matrix.service }}"
          echo "  Container App: ${{ matrix.container_app }}"
          echo "  Image: $IMAGE"
          echo "  Port: ${{ matrix.port }}"
          echo "  Ingress: ${{ matrix.ingress }}"
          echo "  Config URL: $CONFIG_URL"
          echo "  Eureka URL: $EUREKA_URL"

          if az containerapp show \
            --name ${{ matrix.container_app }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            > /dev/null 2>&1; then

            echo "Container App ${{ matrix.container_app }} already exists. Updating..."

            az containerapp update \
              --name ${{ matrix.container_app }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --image "$IMAGE" \
              --set-env-vars $SERVICE_ENV_VARS

          else

            echo "Container App does not exist. Creating ..."

            az containerapp create \
              --name ${{ matrix.container_app }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --environment ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }} \
              --image "$IMAGE" \
              --ingress ${{ matrix.ingress }} \
              --target-port ${{ matrix.port }} \
              --min-replicas 1 \
              --max-replicas 1 \
              --env-vars $SERVICE_ENV_VARS \
              --health-probe \
              --type liveness \
              --path /actuator/health \
              --port ${{ matrix.port }} \
              --initial-delay 60 \
              --period 30

          fi

      - name: Wait for service to be ready
        shell: bash
        run: |
          echo "Waiting for ${{ matrix.service }} to be ready..."
          for i in {1..20}; do
            STATUS=$(az containerapp show \
              --name ${{ matrix.container_app }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "properties.runningStatus" \
              -o tsv 2>/dev/null || echo "Unknown")

            echo "Attempt $i/20 - Status: $STATUS"

            if [ "$STATUS" = "Running" ]; then
              echo "${{ matrix.container_app }} is running"
              break
            fi

            if [ "$i" -eq 20 ]; then
              echo "⚠️ Service may not be ready yet"
            fi

            sleep 10
          done

      - name: Check service health (if external)
        if: matrix.ingress == 'external'
        shell: bash
        run: |
          FQDN=$(az containerapp show \
            --name ${{ matrix.container_app }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)

          echo "Checking health at: https://${FQDN}/actuator/health"

          for i in {1..10}; do
            RESPONSE=$(curl -s -f "https://${FQDN}/actuator/health" 2>/dev/null || echo "Failed")

            if [[ "$RESPONSE" != "Failed" ]]; then
              echo "Health check passed!"
              
              if echo "$RESPONSE" | grep -q "clientConfigServer".*UNKNOWN; then
                echo "Config Server connection issue detected!"
                echo "Check that Config Server is running and accessible at:"
                echo "   http://${CONFIG_FQDN}:8888"
              fi
              
              if echo "$RESPONSE" | grep -q "Eureka discovery client has not yet successfully connected"; then
                echo "⚠️ Eureka connection issue detected!"
                echo "Check that Eureka is running and accessible at:"
                echo "  http://${EUREKA_FQDN}:8761/eureka/"
              fi
              
              if echo "$RESPONSE" | grep -q "UP" && ! echo "$RESPONSE" | grep -q "UNKNOWN"; then
                echo " All services connected successfully!"
              fi
              
              echo "$RESPONSE" | jq '.' 2>/dev/null || echo "$RESPONSE"
              break
            fi
          
            echo "Attempt $i/10 - Health check failed, waiting..."
            sleep 10
          done

      - name: Check Service health and configuration
        if: matrix.ingress == 'external'
        shell: bash
        run: |
          FQDN=$(az containerapp show \
            --name ${{ matrix.container_app }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          
          echo "=================================================="
          echo "Checking health at: https://${FQDN}/actuator/health"
          echo "=================================================="
          
          for i in {1..10}; do
            RESPONSE=$(curl -s -f "https://${FQDN}/actuator/health" 2>/dev/null || echo "Failed")
          
            if [[ "$RESPONSE" != "Failed" ]]; then
              echo "Health check passed!"
              
              if echo "$RESPONSE" | grep -q "clientConfigServer".*UNKNOWN; then
                echo "Config Server connection issue detected!"
                echo "Check that Config Server is running and accessible at:"
                echo "   http://${CONFIG_FQDN}:8888"
              fi
              
              if echo "$RESPONSE" | grep -q "Eureka discovery client has not yet successfully connected"; then
                echo "Eureka connection issue detected!"
                echo "Check that Eureka is running and accessible at:"
                echo "  http://${EUREKA_FQDN}:8761/eureka/"
              fi
              
              if echo "$RESPONSE" | grep -q "UP" && ! echo "$RESPONSE" | grep -q "UNKNOWN"; then
                echo " All services connected successfully!"
              fi
              
              echo "$RESPONSE" | jq '.' 2>/dev/null || echo "$RESPONSE"
              break
            fi
          
            echo "Attempt $i/10 - Health check failed, waiting..."
            sleep 10
          done

      - name: Display service URL
        if: matrix.ingress == 'external'
        run: |
          FQDN=$(az containerapp show \
            --name ${{ matrix.container_app }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          
          echo "Service ${{ matrix.service }} is accessible at:"
          echo "  https://${FQDN}"
          echo "  Health: https://${FQDN}/actuator/health"
          echo "  Swagger: https://${FQDN}/swagger-ui/index.html"
        

  #===========================================================#
  # Final job to display all service URLs
  #===========================================================#
  display-urls:
    name: Display All Service URLs
    needs: deploy
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Azure Login using Github OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-oidc: true

      - name: Install Azure Container Apps Extension
        run: |
          az extension add --name containerapp --upgrade

      - name: Display all service URLs
        run: |
          echo "=================================================="
          echo "ALL SERVICES DEPLOYED SUCCESSFULLY!"
          echo "=================================================="
          echo ""
          
          # Get Eureka Server URL
          EUREKA_FQDN=$(az containerapp show \
            --name ecommerce-eureka-server \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv 2>/dev/null || echo "Not deployed")
          
          echo " EUREKA SERVER:"
          echo "   Internal: http://ecommerce-eureka-server:8761"
          echo "   Health: http://${EUREKA_FQDN}:8761/actuator/health"
          echo "   Dashboard: http://${EUREKA_FQDN}:8761"
          echo ""
          
          # Get Config Server URL
          CONFIG_FQDN=$(az containerapp show \
            --name ecommerce-config-server \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv 2>/dev/null || echo "Not deployed")
          
          echo "CONFIG SERVER:"
          echo "   URL: http://${CONFIG_FQDN}:8888"
          echo "   Health: http://${CONFIG_FQDN}:8888/actuator/health"
          echo ""
          
          # Get API Gateway URL (external)
          GATEWAY_FQDN=$(az containerapp show \
            --name ecommerce-api-gateway \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv 2>/dev/null || echo "Not deployed")
          
          echo " PUBLIC ENDPOINT:"
          echo "   API Gateway: https://${GATEWAY_FQDN}"
          echo "   Health: https://${GATEWAY_FQDN}/actuator/health"
          echo "   Swagger: https://${GATEWAY_FQDN}/swagger-ui/index.html"
          echo ""
          
          #Display exact environment variables to use
          echo " Environment Variables to use in your services:"
          echo "  CONFIG_SERVER_URL=http://${CONFIG_FQDN}:8888"
          echo "  EUREKA_SERVER_URL=http://${EUREKA_FQDN}:8761/eureka/"
          echo ""
          
          echo "INTERNAL SERVICES (via service discovery):"
          echo "   These services are accessible internally via their service names:"
          echo "   • user-service: http://ecommerce-user-service:8081"
          echo "   • product-service: http://ecommerce-product-service:8083"
          echo "   • order-service: http://ecommerce-order-service:8082"
          echo "   • inventory-service: http://ecommerce-inventory-service:8084"
          echo "   • notification-service: http://ecommerce-notification-service:8085"
          echo ""
          
          echo "=================================================="
          echo "Check Eureka Dashboard for registered services:"
          echo "   http://${EUREKA_FQDN}:8761"
          echo "=================================================="