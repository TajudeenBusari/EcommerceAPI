name: Ecommerce build and deploy a container to an Azure Web App

env:
  AZURE_WEBAPP_NAME: ecommerce-java-web-app
  FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_CONFIG_BASE64 }}
  JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
  JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}

on:
  push:
    branches:
      - master

permissions:
  contents: 'read'
  packages: 'write'

jobs:
  #======================================================================#
    #first job builds all modules and skips tests.
    #Just want the executable jar files to be built
    #and cached for the next job to deploy the container to Azure Web App
  #======================================================================#
  build:
    name: Build All Modules
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Decode and save Firebase config
        run: echo "$FIREBASE_CONFIG_BASE64" | base64 -d > firebase-service-config.json

      - name: Create JWT Key files
        run: |
          mkdir -p user-service/src/main/resources/certs
          printf "%s" "$JWT_PRIVATE_KEY" > user-service/src/main/resources/certs/private.pem
          printf "%s" "$JWT_PUBLIC_KEY" > user-service/src/main/resources/certs/public.pem

      - name: Build all Maven modules (skipping tests)
        run: mvn --batch-mode clean install -DskipTests

      - name: Upload Maven target directory
        uses: actions/upload-artifact@v4
        with:
          name: maven-targets
          path: |
            api-gateway/target
            config-server/target
            eureka-server/target
            inventory-service/target
            notification-service/target
            order-service/target
            product-service/target
            user-service/target
          retention-days: 1

  #======================================================================#
    #build docker image for each service
  #======================================================================#

  docker:
    name: Build and Push ${{ matrix.service }} Docker Image
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - config-server
          - eureka-server
          - inventory-service
          - notification-service
          - order-service
          - product-service
          - user-service
    steps:
      - name: Check out the repository
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Decode and save Firebase config
        run: echo "$FIREBASE_CONFIG_BASE64" | base64 -d > firebase-service-config.json

      - name: Create JWT Key files
        run: |
          mkdir -p user-service/src/main/resources/certs
          printf "%s" "$JWT_PRIVATE_KEY" > user-service/src/main/resources/certs/private.pem
          printf "%s" "$JWT_PUBLIC_KEY" > user-service/src/main/resources/certs/public.pem

      #======================================================================#
      # Build the selected microservice.
      # Shared modules are built automatically if required.
      #======================================================================#
      - name: Build ${{ matrix.service }} Docker Image
        run: |
          mvn --batch-mode -pl ${{ matrix.service }} -am clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub container registry
        uses: docker/login-action@v3 #the GITHUB_TOKEN is used here for authentication so that it can push the spring boot application image to GitHub container registry. The secret is automatically created by GitHub for each repository and is available in the secrets context.
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # at the start of each work flow job, the GitHub automatically created a unique token to use in the work flow job. This token is stored in the secrets.GITHUB_TOKEN variable.
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and push ${{ matrix.service }} container image to registry
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure Web App
    needs: docker #deployment job depends on the docker build job
    runs-on: ubuntu-latest

    steps:
      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: |
            ghcr.io/${{ env.REPO }}/api-gateway:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/config-server:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/eureka-server:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/inventory-service:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/notification-service:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/order-service:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/product-service:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/user-service:${{ github.sha }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          #get the publish profile from Azure portal and add it to the repo secrets
          #(if you are getting download error, then in web app -> settings -> configuration -> general settings -> enable scm basic auth and then download the publish profile)
          #it should be named AZURE_WEBAPP_PUBLISH_PROFILE in the repo secrets
          #the secret will be used by the GitHub actions to access the Azure Web App and deploy the container images to it
